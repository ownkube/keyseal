name: Release

# Push a tag vX.Y.Z (or vX.Y.Z-pre.N) matching ts/package.json to publish.
# npm trusted publishing: no npm token is stored anywhere, and every
# release carries a provenance statement tying it to this workflow run.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      # No dependency cache: a release builds from a clean install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1

      - name: Tag matches package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (on) exit; on = ($2 == v) ; next }
            on { print }
          ' ../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: Publish to npm
        run: |
          case "$VERSION" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $PRE \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
